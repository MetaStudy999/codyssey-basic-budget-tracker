name: B2-1 Round 04 CLI tests
on:
  push:
    paths:
      - 'training/round-04-agent/04-src/**'
      - '.github/workflows/b2-1-round04-tests.yml'
  pull_request:
    paths:
      - 'training/round-04-agent/04-src/**'
      - '.github/workflows/b2-1-round04-tests.yml'
  workflow_dispatch:
jobs:
  unit-and-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unittest (standard library only)
        working-directory: training/round-04-agent/04-src
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Help and temporary-folder CLI smoke
        working-directory: training/round-04-agent/04-src
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python -m budget_app --help
          python -m budget_app category --help
          TEST_DIR="$(mktemp -d)"
          python -m budget_app --data-dir "$TEST_DIR" category list
          python -m budget_app --data-dir "$TEST_DIR" summary --month 2026-10
